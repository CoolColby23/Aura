      <stop stop-color="#FFC49B"/>
      <stop offset=".34" stop-color="#FF9AA8"/>
      <stop offset=".7" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#5B5BF5"/>
    </linearGradient>
    <radialGradient id="ambient" cx="270" cy="315" r="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity=".30"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
