  <text x="504" y="352" fill="#A78BFA" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',Helvetica,sans-serif" font-size="34" font-weight="600" letter-spacing="-.4">Now playing, everywhere.</text>
  <text x="504" y="410" fill="#A9A7BC" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',Helvetica,sans-serif" font-size="23" font-weight="500">Discord Rich Presence and Last.fm scrobbling,</text>
