name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.0"

      - name: Parse release tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          RAW="${TAG#v}"
          # Strip pre-release suffix for VERSION file comparison (1.1.0-beta.1 -> 1.1.0)
          BASE="${RAW%%-*}"
          SOURCE_VERSION="$(<VERSION)"
          if [[ "$BASE" != "$SOURCE_VERSION" ]]; then
            echo "Tag base version $BASE does not match VERSION $SOURCE_VERSION" >&2
            exit 1
          fi
          IS_PRERELEASE=false
          if [[ "$RAW" == *-* ]]; then
            IS_PRERELEASE=true
          fi
          {
            echo "version=$RAW"
            echo "base_version=$BASE"
            echo "is_prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Verify website
        run: ./scripts/verify-website.sh

      - name: Package app
        env:
          AURA_VERSION: ${{ steps.meta.outputs.version }}
          AURA_BUILD_NUMBER: ${{ github.run_number }}
          AURA_SIGNING_IDENTITY: "-"
        run: ./scripts/package-app.sh

      - name: Verify app bundle
        env:
          AURA_VERSION: ${{ steps.meta.outputs.version }}
          AURA_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/verify-package.sh

      - name: Create DMG
        env:
          AURA_VERSION: ${{ steps.meta.outputs.version }}
        run: ./scripts/create-dmg.sh "${AURA_VERSION}"

      - name: Create checksum
        env:
          AURA_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          shasum -a 256 "Aura-${AURA_VERSION}.dmg" > "Aura-${AURA_VERSION}.sha256"
          hdiutil verify "Aura-${AURA_VERSION}.dmg"
          shasum -a 256 -c "Aura-${AURA_VERSION}.sha256"

      - name: Generate signed update feed
        if: steps.meta.outputs.is_prerelease != 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          APPCAST_TOOL="$(find .build/artifacts .build/checkouts -type f -name generate_appcast -perm +111 -print -quit 2>/dev/null)"
          test -x "$APPCAST_TOOL"
          mkdir appcast
          cp Aura-*.dmg appcast/
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$APPCAST_TOOL" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/CoolColby23/Aura/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://presence-fm.vercel.app/" \
            --maximum-versions 1 \
            -o appcast/appcast.xml \
            appcast
          cp appcast/appcast.xml ./appcast.xml

      - name: Verify the update feed is signed
        if: steps.meta.outputs.is_prerelease != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # generate_appcast only signs when the app's SUPublicEDKey matches the
          # private key it was given. On a mismatch it prints a warning, emits an
          # UNSIGNED enclosure, and still exits 0 -- which would ship an update
          # Sparkle refuses to install. Fail the release instead.
          grep -q 'sparkle:edSignature=' appcast.xml || {
            echo "::error::appcast.xml has no sparkle:edSignature." >&2
            echo "SPARKLE_PRIVATE_KEY does not match SUPublicEDKey in scripts/package-app.sh." >&2
            cat appcast.xml >&2
            exit 1
          }
          grep -q "<sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>" appcast.xml \
            || { echo "::error::appcast.xml does not advertise ${VERSION}" >&2; cat appcast.xml >&2; exit 1; }
          grep -q "releases/download/${GITHUB_REF_NAME}/Aura-${VERSION}.dmg" appcast.xml \
            || { echo "::error::appcast enclosure URL does not point at this release's DMG" >&2; cat appcast.xml >&2; exit 1; }
          echo "Update feed is signed and points at Aura-${VERSION}.dmg."

      - name: Prepare release notes
        env:
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            printf '%s\n' \
              "## Aura ${VERSION} (pre-release)" \
              "" \
              "This is a **pre-release** build for testing. It is not marked as Latest and does not update the production Sparkle appcast." \
              "" \
              "- Requires macOS 15 or later" \
              "- Ad-hoc signed: first launch may need Control-click → Open" \
              "- Report issues on GitHub" \
              > release-body.md
          else
            printf '%s\n' \
              "## Aura ${VERSION}" \
              "" \
              "Production release. In-app updates use the signed \`appcast.xml\` attached to this release." \
              "" \
              "- Requires macOS 15 or later" \
              "- Ad-hoc signed: first launch may need Control-click → Open" \
              > release-body.md
          fi

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          body_path: release-body.md
          fail_on_unmatched_files: false
          files: |
            Aura-*.dmg
            Aura-*.sha256
            appcast.xml
