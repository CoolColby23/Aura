<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; navigate-to aura:" />
    <title>Return to Aura</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", sans-serif; }
      body { align-items: center; background: #0f0f17; color: #f7f6fb; display: flex; justify-content: center; margin: 0; min-height: 100vh; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      /* The Aura halo: a gradient ring with a small core, matching brand/aura-symbol.svg. */
      .halo { background: conic-gradient(#ffc49b, #ff9aa8 22%, #a78bfa 48%, #5b5bf5 74%, #ffc49b); border-radius: 50%; height: 5rem; margin: 0 auto 1.5rem; position: relative; width: 5rem; }
      .halo::before { background: #0f0f17; border-radius: 50%; content: ""; height: 3.93rem; left: 50%; position: absolute; top: 50%; transform: translate(-50%, -50%); width: 3.93rem; }
      .halo::after { background: conic-gradient(#ffc49b, #ff9aa8 22%, #a78bfa 48%, #5b5bf5 74%, #ffc49b); border-radius: 50%; content: ""; height: 1.07rem; left: 50%; position: absolute; top: 50%; transform: translate(-50%, -50%); width: 1.07rem; }
      h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 0.75rem; }
      p { color: #a9a7bc; line-height: 1.5; }
      a { background: #5b5bf5; border-radius: 999px; box-shadow: 0 4px 12px rgba(91, 91, 245, 0.35); color: white; display: inline-block; font-weight: 700; margin-top: 1rem; padding: 0.9rem 1.4rem; text-decoration: none; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="halo" aria-hidden="true"></div>
      <h1>Return to Aura</h1>
      <p id="status">Authorization is complete. Returning you to the app…</p>
      <a id="open-app" href="aura://lastfm-auth" hidden>Open Aura</a>
    </main>
    <script>
      const token = new URLSearchParams(window.location.search).get("token");
      const status = document.querySelector("#status");
      const link = document.querySelector("#open-app");

      if (token) {
        link.href = `aura://lastfm-auth?token=${encodeURIComponent(token)}`;
        link.hidden = false;
        window.location.replace(link.href);
      } else {
        status.textContent = "Last.fm did not provide an authorization token. Return to Aura and try again.";
      }
    </script>
  </body>
</html>
